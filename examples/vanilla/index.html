<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apixa × Vanilla JS</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Apixa · Vanilla</p>
      <h1>No framework — just <code>defineApi</code></h1>
      <p class="lede">Vite bundles TypeScript + <code>@apixa/core</code> for a plain DOM app.</p>
      <p id="status"></p>
      <ul id="list"></ul>
      <form id="form">
        <input id="name" name="name" placeholder="Name" required />
        <input id="email" name="email" type="email" placeholder="Email" required />
        <button type="submit">Create</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
